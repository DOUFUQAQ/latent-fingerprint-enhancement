name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: unittest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install minimal dependencies
        # The unit tests are deliberately numpy-only; torch / opencv / sklearn
        # are optional and their tests are skipped when they are absent.
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Byte-compile every module
        run: python -m compileall -q .

      - name: Run tests (numpy only, torch/cv2/sklearn paths skipped)
        run: python -m unittest discover -s tests -t . -v

  full:
    name: unittest + OpenCV/scikit-learn
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless scipy scikit-learn matplotlib tqdm

      - name: Run tests with the optional dependencies present
        run: python -m unittest discover -s tests -t . -v

  lint:
    name: ruff
    runs-on: ubuntu-latest
    continue-on-error: true      # 存量代码尚未 lint-clean，仅作提示
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: ruff (advisory)
        run: ruff check latentfp latentfp_v2 repair evaluation tests --output-format=github || true
